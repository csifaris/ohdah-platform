<!DOCTYPE html>

<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ohdah (عُهدة) - تسجيل الدخول</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- Tailwind Config injected from system prompt -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#eceef0",
                        "tertiary-container": "#314156",
                        "on-surface": "#191c1e",
                        "outline-variant": "#c5c5d3",
                        "secondary-container": "#6cf8bb",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#1e3a8a",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "secondary": "#006c49",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "surface-container-high": "#e6e8ea",
                        "outline": "#757682",
                        "on-tertiary-fixed-variant": "#38485d",
                        "surface-variant": "#e0e3e5",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-fixed": "#002113",
                        "primary-fixed": "#dce1ff",
                        "error-container": "#ffdad6",
                        "tertiary": "#1b2b3f",
                        "surface-dim": "#d8dadc",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#444651",
                        "secondary-fixed": "#6ffbbe",
                        "on-primary-fixed-variant": "#264191",
                        "on-background": "#191c1e",
                        "surface-bright": "#f7f9fb",
                        "on-primary-container": "#90a8ff",
                        "inverse-surface": "#2d3133",
                        "primary-fixed-dim": "#b6c4ff",
                        "secondary-fixed-dim": "#4edea3",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#9dadc6",
                        "on-error-container": "#93000a",
                        "surface-tint": "#4059aa",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#d3e4fe",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed-variant": "#005236",
                        "inverse-on-surface": "#eff1f3",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#00714d",
                        "primary-container": "#1e3a8a",
                        "inverse-primary": "#b6c4ff",
                        "background": "#f8fafc",
                        "on-primary-fixed": "#00164e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "sans": ["Inter", "sans-serif"],
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Animations */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.6s ease-out forwards;
        }

        /* Focus Ring */
        .input-focus-ring:focus-within {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 1px #1e3a8a;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-4 md:p-8 relative overflow-hidden bg-slate-50">
<!-- Background decorative elements (Subtle) -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-100 via-transparent to-transparent"></div>
<div class="absolute inset-0 z-0 pointer-events-none opacity-30 bg-[radial-gradient(ellipse_at_bottom_left,_var(--tw-gradient-stops))] from-slate-200 via-transparent to-transparent"></div>
<!-- Login Card -->
<div class="w-full max-w-[480px] bg-white rounded-2xl shadow-[0_20px_40px_-15px_rgba(0,0,0,0.05)] border border-slate-100 p-8 sm:p-12 z-10 animate-fade-in-up flex flex-col">
<!-- Logo Section -->
<div class="flex flex-col items-center text-center mb-8">
<img class="w-20 h-20 object-contain rounded-xl mb-6 shadow-sm" data-alt="Ohdah Logo" src="https://lh3.googleusercontent.com/aida/AP1WRLuRO9qiXXJSKwCK_Q-3B2w73EVe0YNw7yWiyz7zycoPDpnws3dPbzBgOP4LS8yFQk-3hfmd1YtkPCbS8Iak0v3c6IIuWkL4vVYijMwPMDlSxzyw_Luyo1IgmvTvABDzrl2rO2VcqAR59eDMm3FOFAKTPJc7LkXP80uhW_dxMUerjaelRF33_lk9h8VVCOKLPCPPJLRCeqjXcJyGVsGPIfOAygo2pHuGkTsIAEF_eY4tV9rYbcNV-UWMAUI"/>
<h1 class="text-2xl font-bold text-slate-900 mb-2">تسجيل الدخول</h1>
<p class="text-sm text-slate-500">الوصول إلى نظام إدارة العهد والأصول</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5" id="loginForm">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-slate-700" for="email">البريد الإلكتروني</label>
<div class="relative flex items-center border border-slate-300 rounded-lg bg-white input-focus-ring transition-colors duration-200">
<i class="w-5 h-5 text-slate-400 absolute right-3 pointer-events-none" data-lucide="mail"></i>
<input class="w-full bg-transparent border-none py-2.5 pr-10 pl-3 text-base text-slate-900 focus:ring-0 placeholder:text-slate-400" id="email" placeholder="أدخل البريد الإلكتروني" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-slate-700" for="password">كلمة المرور</label>
<div class="relative flex items-center border border-slate-300 rounded-lg bg-white input-focus-ring transition-colors duration-200">
<i class="w-5 h-5 text-slate-400 absolute right-3 pointer-events-none" data-lucide="lock"></i>
<input class="w-full bg-transparent border-none py-2.5 pr-10 pl-10 text-base text-slate-900 focus:ring-0 placeholder:text-slate-400" id="password" placeholder="أدخل كلمة المرور" required="" type="password"/>
<button class="absolute left-3 text-slate-400 hover:text-[#1e3a8a] transition-colors focus:outline-none" id="togglePassword" type="button">
<i class="w-5 h-5" data-lucide="eye" id="visibilityIcon"></i>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-slate-300 text-[#1e3a8a] focus:ring-[#1e3a8a] w-4 h-4 transition-colors cursor-pointer" type="checkbox"/>
<span class="text-sm text-slate-600 group-hover:text-slate-900 transition-colors">تذكرني</span>
</label>
<a class="text-sm font-medium text-[#1e3a8a] hover:underline transition-all" href="#">نسيت كلمة المرور؟</a>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full bg-[#1e3a8a] text-white font-semibold py-3 px-4 rounded-lg hover:bg-[#172d6e] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 relative overflow-hidden group shadow-md shadow-blue-900/10" id="submitBtn" type="submit">
<span id="btnText">تسجيل الدخول</span>
<i class="w-4 h-4 text-white transition-transform group-hover:-translate-x-1" data-lucide="arrow-left"></i> <!-- RTL arrow -->
<!-- Loading Spinner (Hidden by default) -->
<svg class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white absolute" fill="none" id="loadingSpinner" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</button>
<!-- Error Message Container -->
<div class="hidden mt-2 p-3 bg-red-50 border border-red-100 text-red-700 text-sm rounded-lg flex items-start gap-2" id="errorMessage">
<i class="w-5 h-5 text-red-500 shrink-0" data-lucide="alert-circle"></i>
<p>بيانات الدخول غير صحيحة، يرجى المحاولة مرة أخرى.</p>
</div>
</form>
</div>
</main>
<script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Password Visibility Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibilityIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Re-render icon
            visibilityIcon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        });

        // Form Submission Simulation
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const emailInput = document.getElementById('email');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Reset error state
            errorMessage.classList.add('hidden');
            
            // Loading State
            submitBtn.classList.add('opacity-90', 'cursor-not-allowed');
            btnText.classList.add('invisible');
            submitBtn.querySelector('[data-lucide]').classList.add('hidden');
            loadingSpinner.classList.remove('hidden');
            
            // Simulate API Call
            setTimeout(() => {
                // Remove loading state
                submitBtn.classList.remove('opacity-90', 'cursor-not-allowed');
                btnText.classList.remove('invisible');
                submitBtn.querySelector('[data-lucide]').classList.remove('hidden');
                loadingSpinner.classList.add('hidden');

                // Simulate validation
                if(emailInput.value === 'admin@ohdah.com') {
                     alert('تم تسجيل الدخول بنجاح');
                } else {
                     errorMessage.classList.remove('hidden');
                     errorMessage.classList.add('animate-fade-in-up');
                }
            }, 1500);
        });
    </script>
</body></html>
